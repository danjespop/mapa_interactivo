<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Atlas">
<meta name="theme-color" content="#e9f1f6">
<title>Atlas de estudio</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="iconos/icono-180.png">
<link rel="icon" type="image/png" href="iconos/icono-192.png">
<link rel="stylesheet" href="css/estilos.css">
<link rel="stylesheet" href="css/fuentes.css"></head>
<body>
<!--CUERPO-->
<div id="app">
  <section id="inicio" class="inicio">
    <header>
      <a href="index.html" class="volver-geografia">‹ Todos los módulos</a>
      <h1>Geografía</h1>
      <p>Elige un mapa para aprender y jugar</p>
    </header>
    <button id="btnGlobo" class="globo-entrada" type="button">
      <span class="bola" aria-hidden="true"></span>
      <span class="texto"><strong>Globo terráqueo</strong><span>Toda la Tierra en 3D con los lugares de todos los mapas</span></span>
    </button>
    <div id="tarjetas" class="tarjetas"></div>
    <button id="btnBuscarInicio" class="boton" type="button">Buscar un lugar</button>
    <button id="btnAcerca" class="enlace" type="button">Acerca de</button>
  </section>

  <section id="mapa" class="pantalla" hidden>
    <header class="barra">
      <button id="btnVolver" class="redondo" type="button" aria-label="Volver a los mapas">‹</button>
      <h2 id="tituloMapa"></h2>
      <button id="btnBuscar" class="redondo" type="button" aria-label="Buscar un lugar"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg></button>
      <button id="btnPantalla" class="redondo" type="button" aria-label="Web a pantalla completa" hidden><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      <div class="segmento" role="tablist">
        <button type="button" role="tab" data-modo="aprender" aria-selected="true">Aprender</button>
        <button type="button" role="tab" data-modo="jugar" aria-selected="false">Jugar</button>
      </div>
    </header>
    <nav id="temas" class="temas" aria-label="Temas"></nav>
    <div id="pregunta" class="pregunta" hidden></div>
    <div id="escenario" class="escenario">
      <svg id="svg" role="img" aria-label="Mapa"></svg>
      <div class="pastillas">
        <button id="btnNombres" class="pastilla" type="button">Ocultar nombres</button>
        <button id="btnImprimir" class="pastilla" type="button">Imprimir</button>
      </div>
      <div id="flotante" class="flotante" hidden></div>
      <div class="zoom">
        <button id="zMas" type="button" aria-label="Acercar">+</button>
        <button id="zMenos" type="button" aria-label="Alejar">−</button>
        <button id="zTodo" type="button" aria-label="Ver el mapa entero">↺</button>
        <button id="zAmplio" type="button" aria-label="Mapa a pantalla completa" aria-pressed="false"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      </div>
    </div>
    <aside id="panel" class="panel"></aside>
  </section>

  <section id="globo" class="pantalla globo" hidden>
    <header class="barra">
      <button id="gVolver" class="redondo" type="button" aria-label="Volver a los mapas">‹</button>
      <h2>Globo terráqueo</h2>
    </header>
    <div id="gEsc" class="escenario">
      <canvas id="gGL"></canvas>
      <canvas id="g2D" role="img" aria-label="Globo terráqueo"></canvas>
      <div id="gAviso" class="aviso-globo" hidden></div>
      <div id="gRotulo" class="flotante" hidden></div>
      <div class="pastillas">
        <button id="gLugares" class="pastilla" type="button">Ocultar lugares</button>
        <button id="gNombres" class="pastilla" type="button">Ocultar nombres</button>
      </div>
      <div class="zoom">
        <button id="gMas" type="button" aria-label="Acercar">+</button>
        <button id="gMenos" type="button" aria-label="Alejar">−</button>
        <button id="gTodo" type="button" aria-label="Ver la Tierra entera">↺</button>
      </div>
    </div>
    <aside id="gPanel" class="panel"></aside>
  </section>

  <div id="capa" class="capa" hidden><div id="hoja" class="hoja" role="dialog" aria-modal="true"></div></div>
</div>
<!--/CUERPO-->
<script src="js/fuentes.js"></script><script src="js/version.js"></script>
<script src="js/datos.js"></script>
<script src="js/app.js"></script>
<script src="js/globo-datos.js"></script>
<script src="js/globo.js"></script>
</body>
</html>
